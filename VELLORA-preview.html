<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030305">
<title>VELLORA — Preview</title>
<style>:root {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
  color: #f5f5f7;
  background: #030305;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --bg: #030305;
  --panel: rgba(12, 12, 17, 0.72);
  --panel-strong: rgba(10, 10, 14, 0.9);
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.15);
  --text: #f5f5f7;
  --muted: #a7a7b2;
  --dim: #696973;
  --violet: #8b5cf6;
  --violet-soft: #a78bfa;
  --cyan: #5ec6db;
  --mint: #59d6b1;
  --amber: #d8a74f;
  --rose: #ef6f9d;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); }
body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); color: var(--text); }
button, input, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { border: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid rgba(167, 139, 250, 0.95); outline-offset: 3px; }
::selection { background: rgba(139,92,246,0.28); color: #fff; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #7e7e8a; font-weight: 650; }
.glass-panel { background: linear-gradient(180deg, rgba(19,19,25,0.76), rgba(8,8,12,0.82)); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 20px 70px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.03); backdrop-filter: blur(20px); }

.pattern-waves { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.intro-vignette, .app-vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% 45%, transparent 0 20%, rgba(3,3,5,0.26) 62%, rgba(3,3,5,0.9) 100%); }
.app-shell, .intro-screen { min-height: 100vh; position: relative; isolation: isolate; overflow-x: clip; }

/* Intro */
.intro-screen { display: grid; place-items: center; background: #030305; animation: intro-black-in 1s ease both; }
.intro-content { position: relative; z-index: 1; width: min(1100px, 92vw); display: grid; justify-items: center; text-align: center; animation: intro-fade-out 1.5s ease 13.6s both; }
.masked-heading { width: min(760px, 86vw); font-size: clamp(50px, 9vw, 112px); line-height: .84; font-weight: 900; letter-spacing: -0.08em; color: transparent; background-image: linear-gradient(120deg, rgba(245,245,247,0.02), rgba(167,139,250,0.9), rgba(245,245,247,0.08)); background-size: 180% 180%; background-position: 0 50%; -webkit-background-clip: text; background-clip: text; filter: blur(16px); opacity: 0; transform: translateY(18px) scale(0.98); animation: masked-reveal 2.7s cubic-bezier(.22,1,.36,1) 2.1s both, masked-drift 9s ease-in-out 5s infinite alternate; }
.masked-heading span { display: inline-block; }
.masked-heading.is-active { opacity: 1; }
.masked-heading.reduced { animation: masked-reveal-reduced 1s ease 0.2s both; }
.particle-text-wrap { width: min(1100px, 96vw); height: clamp(130px, 23vw, 250px); margin: 10px 0 6px; }
.particle-text { width: 100%; height: 100%; display: block; }
.intro-subtitle { display: grid; gap: 18px; justify-items: center; }
.blur-text { opacity: 0; filter: blur(10px); transform: translateY(12px); animation: blur-in 1.25s cubic-bezier(.22,1,.36,1) 7.8s both; font-weight: 680; letter-spacing: 0.18em; font-size: clamp(14px, 1.4vw, 18px); }
.creator-credit { color: #7a7a85; font-weight: 450; font-size: 11px; letter-spacing: 0.08em; animation-delay: 9.6s; }

@keyframes intro-black-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes masked-reveal { 0% { opacity: 0; filter: blur(22px); transform: translateY(28px) scale(0.96); background-position: 0 50%; } 55% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); background-position: 72% 44%; } 100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); background-position: 100% 40%; } }
@keyframes masked-reveal-reduced { from { opacity: 0; } to { opacity: 1; filter: none; transform: none; } }
@keyframes masked-drift { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes blur-in { from { opacity: 0; filter: blur(11px); transform: translateY(12px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes intro-fade-out { 0% { opacity: 1; filter: blur(0); } 84% { opacity: 1; filter: blur(0); } 100% { opacity: 0; filter: blur(8px); } }

/* shell */
.shell-width { width: min(1280px, calc(100vw - 48px)); margin: 0 auto; }
.topbar { position: relative; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 24px 0 10px; }
.brand-mark { display: inline-flex; justify-self: start; align-items: center; gap: 9px; background: transparent; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; }
.brand-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet-soft); box-shadow: 0 0 16px rgba(167,139,250,.75); }
.topbar-status { justify-self: center; color: #777782; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; }
.status-pulse { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px rgba(89,214,177,.5); margin-right: 7px; }
.topbar-credit { justify-self: end; color: #60606a; font-size: 10px; letter-spacing: 0.06em; }
.main-content { position: relative; z-index: 2; padding: 48px 0 90px; }
.site-footer { position: relative; z-index: 2; display: flex; justify-content: space-between; gap: 24px; border-top: 1px solid rgba(255,255,255,0.06); padding: 18px 0 24px; color: #5f5f69; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; }

.page-enter { animation: page-in .65s cubic-bezier(.22,1,.36,1) both; }
@keyframes page-in { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

/* welcome */
.welcome-stage { min-height: calc(100vh - 170px); display: grid; grid-template-columns: 1.18fr .82fr; align-items: center; gap: 7vw; padding: 7vh 0 3vh; }
.welcome-copy { max-width: 690px; }
.welcome-copy h1 { margin: 18px 0 24px; font-size: clamp(52px, 7vw, 106px); line-height: .92; letter-spacing: -.07em; font-weight: 800; }
.welcome-copy h1 em { font-style: normal; color: #8c8c97; }
.welcome-copy p { max-width: 600px; margin: 0; color: #a4a4ad; font-size: 15px; line-height: 1.8; }
.welcome-actions { display: flex; align-items: center; gap: 18px; margin-top: 34px; }
.welcome-actions > span { color: #62626d; font-size: 10px; letter-spacing: .05em; }
.fuse-button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 18px; border-radius: 14px; cursor: pointer; color: #fff; background: linear-gradient(180deg, #18131f, #0e0d13); border: 1px solid rgba(167,139,250,.38); box-shadow: 0 10px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05); transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; font-size: 10px; letter-spacing: .11em; font-weight: 750; }
.fuse-button:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(167,139,250,.72); box-shadow: 0 14px 36px rgba(70,37,130,.22), inset 0 1px 0 rgba(255,255,255,.06); }
.fuse-button.is-pressed:not(:disabled) { transform: translateY(1px) scale(.985); }
.fuse-button:disabled { opacity: .38; cursor: not-allowed; }
.fuse-button.destructive { color: #ffb0c9; border-color: rgba(239,111,157,.22); }
.button-orbit { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(167,139,250,.35); border-top-color: #a78bfa; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.welcome-card { min-height: 420px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transform: rotate(-1.2deg); }
.mini-card-head, .mini-card-footer { display: flex; justify-content: space-between; align-items: center; color: #676773; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
.mini-card-footer strong { color: #f2f2f6; font-size: 14px; letter-spacing: 0; text-transform: none; }
.mini-graph { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; height: 230px; padding: 28px 0; border-top: 1px solid rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.05); background: radial-gradient(circle at 45% 55%, rgba(139,92,246,.12), transparent 45%); }
.mini-graph::before { content: ''; position: absolute; inset: 15% 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 100% 25%; pointer-events: none; }
.mini-graph > span { display: block; position: relative; z-index: 1; border-radius: 8px 8px 2px 2px; background: linear-gradient(180deg, rgba(167,139,250,.72), rgba(139,92,246,.16)); box-shadow: 0 0 20px rgba(139,92,246,.1); animation: mini-rise 1.2s cubic-bezier(.22,1,.36,1) both; }
.mini-graph > span:nth-child(2n) { animation-delay: .08s; }
@keyframes mini-rise { from { transform: scaleY(0); transform-origin: bottom; opacity: .2; } to { transform: scaleY(1); transform-origin: bottom; opacity: 1; } }
.mini-line { position: absolute; inset: 18% 0 auto; height: 1px; background: linear-gradient(90deg, transparent, rgba(167,139,250,.6), transparent); transform: skewY(-3deg); }

/* upload */
.page-head { display: grid; grid-template-columns: 160px 1fr; gap: 24px; align-items: start; margin-bottom: 30px; }
.back-link { display: inline-flex; align-items: center; gap: 8px; align-self: start; background: transparent; color: #898994; cursor: pointer; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 9px 0; }
.back-link:hover { color: #fff; }
.page-head h1, .processing-head h1, .report-toolbar h1 { margin: 8px 0 10px; font-size: clamp(34px, 4.2vw, 58px); letter-spacing: -.05em; line-height: .98; }
.page-head p, .processing-head p, .report-toolbar p { margin: 0; max-width: 700px; color: #85858f; line-height: 1.7; font-size: 13px; }
.upload-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
.upload-main { padding: 18px; }
.upload-stack { display: grid; gap: 18px; }
.dropzone { min-height: 230px; display: flex; align-items: center; justify-content: center; gap: 18px; border: 1px dashed rgba(167,139,250,.26); border-radius: 18px; background: radial-gradient(circle at 50% 40%, rgba(139,92,246,.08), transparent 52%), rgba(3,3,5,.22); cursor: pointer; transition: border-color .18s ease, transform .18s ease, background .18s ease; text-align: left; }
.dropzone:hover, .dropzone.is-over { border-color: rgba(167,139,250,.68); background: radial-gradient(circle at 50% 40%, rgba(139,92,246,.13), transparent 58%), rgba(3,3,5,.22); transform: translateY(-1px); }
.drop-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: #c9c1f7; background: rgba(139,92,246,.1); border: 1px solid rgba(167,139,250,.18); }
.dropzone strong { display: block; font-size: 12px; letter-spacing: .12em; }
.dropzone p { margin: 7px 0 4px; color: #a2a2ad; font-size: 12px; }
.dropzone small { color: #61616d; font-size: 10px; }
.file-list { padding: 4px; }
.file-list-head { display: flex; justify-content: space-between; padding: 4px 4px 10px; color: #6d6d77; font-size: 9px; letter-spacing: .12em; }
.file-list-head strong { color: #9b9ba5; }
.file-row { display: grid; grid-template-columns: 34px 1fr auto 30px; gap: 12px; align-items: center; padding: 13px 8px; border-top: 1px solid rgba(255,255,255,.045); }
.file-symbol { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: rgba(89,214,177,.07); color: var(--mint); }
.file-meta { min-width: 0; display: grid; gap: 4px; }
.file-meta strong { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta span { font-size: 9px; color: #676773; }
.file-state { font-size: 9px; color: var(--mint); white-space: nowrap; }
.icon-button { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 11px; color: #a9a9b2; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); cursor: pointer; }
.icon-button:hover { color: #fff; background: rgba(255,255,255,.07); }
.icon-button.subtle { background: transparent; border-color: transparent; }
.empty-file { padding: 26px 10px 18px; color: #8e8e99; font-size: 12px; }
.empty-file span { display: block; margin-top: 6px; color: #5d5d67; font-size: 10px; }
.upload-summary { display: flex; justify-content: space-between; padding: 2px 2px 0; color: #696975; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
.option-panel { padding: 20px; display: grid; gap: 15px; align-content: start; }
.option-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 7px; }
.text-loop { color: #8a8a94; font-size: 9px; letter-spacing: .06em; }
.glide-select { position: relative; }
.field-label { display: block; color: #686873; font-size: 8px; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 7px; }
.glide-trigger { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 12px; background: rgba(255,255,255,.025); color: #f1f1f4; border: 1px solid rgba(255,255,255,.07); border-radius: 13px; text-align: left; cursor: pointer; }
.glide-trigger strong { display: block; font-size: 10px; }
.glide-trigger small { display: block; color: #64646e; font-size: 9px; margin-top: 3px; }
.chevron { color: #777782; transition: transform .18s ease; }
.chevron.open { transform: rotate(180deg); }
.glide-menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; opacity: 0; transform: translateY(-8px) scale(.98); pointer-events: none; padding: 6px; border-radius: 15px; border: 1px solid rgba(255,255,255,.1); background: rgba(11,11,16,.95); backdrop-filter: blur(18px); box-shadow: 0 20px 50px rgba(0,0,0,.55); transition: opacity .18s ease, transform .18s ease; }
.glide-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.glide-option { position: relative; display: flex; width: 100%; align-items: center; gap: 9px; padding: 10px 9px; background: transparent; color: #9a9aa4; border-radius: 10px; cursor: pointer; text-align: left; }
.glide-option:hover, .glide-option.selected { background: rgba(139,92,246,.09); color: #fff; }
.glide-option strong { display: block; font-size: 10px; }
.glide-option small { display: block; margin-top: 3px; font-size: 8px; color: #656570; }
.glide-indicator { width: 3px; height: 14px; border-radius: 999px; background: var(--violet-soft); box-shadow: 0 0 12px rgba(167,139,250,.45); opacity: 0; transition: transform .18s ease, opacity .18s ease; }
.glide-option.selected .glide-indicator, .glide-option:hover .glide-indicator { opacity: 1; }
.custom-ratio { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; color: #6e6e79; font-size: 11px; }
.custom-ratio label { display: grid; gap: 5px; color: #6f6f7a; font-size: 8px; text-transform: uppercase; letter-spacing: .12em; }
.custom-ratio input { width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.025); color: #f5f5f7; padding: 9px 10px; }
.validation-panel { margin-top: 18px; padding: 16px 18px; }
.validation-panel p { margin: 7px 0 0; font-size: 10px; line-height: 1.5; }
.validation-warning { color: #c6ae7c; }
.validation-error { color: #ee98b5; }
.upload-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.upload-actions .fuse-button:first-child { min-width: 220px; }

/* processing */
.processing-stage { padding: 6vh 0 8vh; }
.processing-head { max-width: 820px; }
.processing-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; margin-top: 28px; }
.processing-loader, .thought-card { padding: 28px; min-height: 320px; }
.lattice-loader { min-height: 250px; display: grid; place-items: center; text-align: center; }
.lattice-orbit { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 1px solid rgba(167,139,250,.17); box-shadow: inset 0 0 40px rgba(139,92,246,.04), 0 0 60px rgba(139,92,246,.05); }
.lattice-orbit::before, .lattice-orbit::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; border: 1px dashed rgba(167,139,250,.12); transform: rotate(26deg); }
.lattice-orbit::after { inset: 7%; transform: rotate(-26deg); }
.lattice-orbit span { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 14px rgba(167,139,250,.75); animation: orbit 3.4s linear infinite; }
.lattice-orbit span:nth-child(1) { top: -4px; left: calc(50% - 4px); }
.lattice-orbit span:nth-child(2) { right: 10px; top: calc(50% - 4px); animation-delay: -.85s; }
.lattice-orbit span:nth-child(3) { bottom: -4px; left: calc(50% - 4px); animation-delay: -1.7s; }
.lattice-orbit span:nth-child(4) { left: 10px; top: calc(50% - 4px); animation-delay: -2.55s; }
@keyframes orbit { from { transform: rotate(0deg) translateX(64px) rotate(0deg); } to { transform: rotate(360deg) translateX(64px) rotate(-360deg); } }
.lattice-copy { display: grid; gap: 7px; margin-top: -34px; }
.lattice-copy strong { font-size: 18px; font-weight: 660; }
.loader-time { color: #61616c; font-size: 10px; }
.processing-facts { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.06); padding-top: 14px; color: #666671; font-size: 9px; letter-spacing: .05em; text-transform: uppercase; }
.thoughtline { display: flex; flex-direction: column; height: 100%; justify-content: space-between; gap: 28px; }
.thoughtline-header { display: flex; justify-content: space-between; align-items: center; color: #777783; font-size: 10px; }
.thoughtline-header > div { display: flex; align-items: center; gap: 9px; }
.thoughtline-header strong { color: #c8c8cf; font-size: 9px; letter-spacing: .13em; }
.spark { color: #a78bfa; }
.thoughtline-header > span { color: #555560; }
.thoughtline-stage { font-size: clamp(24px, 3vw, 42px); letter-spacing: -.04em; line-height: 1.1; max-width: 480px; color: #f5f5f7; }
.thoughtline-list { border-top: 1px solid rgba(255,255,255,.06); padding-top: 13px; display: grid; gap: 8px; }
.thoughtline-list > div { display: flex; align-items: center; gap: 9px; color: #50505b; font-size: 10px; transition: color .25s ease; }
.thoughtline-list .current { color: #cacad2; }
.thoughtline-list .complete { color: #72727c; }
.thought-icon { width: 15px; text-align: center; color: #5e5e68; }
.thoughtline-list .complete .thought-icon { color: var(--mint); }
.thoughtline-list .current .thought-icon { color: var(--violet-soft); }

/* report */
.report-stage { display: grid; gap: 16px; }
.report-toolbar { padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.report-toolbar h1 { margin-top: 5px; font-size: clamp(22px, 3vw, 34px); }
.report-toolbar p { font-size: 11px; }
.toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.report-wrap { display: flex; justify-content: center; }
.report-canvas { --report-pad: clamp(18px, 2.2vw, 34px); position: relative; width: 100%; max-width: 1140px; min-height: 1150px; padding: var(--report-pad); overflow: hidden; border-radius: 30px; background: radial-gradient(circle at 85% 12%, rgba(139,92,246,.12), transparent 25%), radial-gradient(circle at 8% 76%, rgba(94,198,219,.06), transparent 20%), #050509; border: 1px solid rgba(255,255,255,.11); box-shadow: 0 28px 90px rgba(0,0,0,.45); }
.report-canvas::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,.045), transparent 22%, transparent 72%, rgba(167,139,250,.025)); }

.report-canvas > .report-header,
.report-canvas > .report-metrics,
.report-canvas > .report-section,
.report-canvas > .peak-grid,
.report-canvas > .split-section,
.report-canvas > .report-footer { opacity: 0; transform: translateY(12px); filter: blur(5px); animation: report-reveal .65s cubic-bezier(.22,1,.36,1) forwards; }
.report-canvas > .report-header { animation-delay: .04s; }
.report-canvas > .report-metrics { animation-delay: .13s; }
.report-canvas > .report-section:nth-of-type(1) { animation-delay: .22s; }
.report-canvas > .report-section:nth-of-type(2) { animation-delay: .3s; }
.report-canvas > .peak-grid { animation-delay: .38s; }
.report-canvas > .split-section:nth-of-type(3) { animation-delay: .47s; }
.report-canvas > .split-section:nth-of-type(4) { animation-delay: .56s; }
.report-canvas > .report-footer { animation-delay: .68s; }
@keyframes report-reveal { to { opacity: 1; transform: translateY(0); filter: blur(0); } }

.report-grid-overlay { position: absolute; inset: 0; pointer-events: none; opacity: .28; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 100% 120px, 120px 100%; mask-image: linear-gradient(to bottom, rgba(0,0,0,.45), transparent 26%, transparent 74%, rgba(0,0,0,.25)); }
.report-header, .report-metrics, .report-section, .peak-grid, .split-section, .report-footer { position: relative; z-index: 1; }
.report-header { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.report-header h2 { margin: 5px 0 6px; font-size: clamp(32px, 4vw, 52px); line-height: .95; letter-spacing: -.06em; }
.report-header p { margin: 0; color: #777782; font-size: 10px; }

function cleanKey(value: unknown): string {
  return String(value ?? '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[\n\r\t]+/g, ' ')
    .replace(/[._\-\/\\]+/g, ' ')
    .replace(/\s+/g, ' ');
}

function cleanText(value: unknown): string {

function toNumber(value: unknown): number {
  if (typeof value === 'number' && Number.isFinite(value)) return value;
  if (value === null || value === undefined || value === '') return 0;
  const raw = String(value).trim();
  if (!raw) return 0;

  const normalized = raw
    .replace(/[()]/g, '')
    .replace(/Rp|IDR|USD|\$|€|£/gi, '')
    .replace(/\s/g, '')
    .replace(/[^0-9,.-]/g, '');
  if (!normalized) return 0;

  const unsigned = normalized.replace(/^-/, '');
  const hasComma = unsigned.includes(',');
  const hasDot = unsigned.includes('.');

    const lastComma = unsigned.lastIndexOf(',');
    const lastDot = unsigned.lastIndexOf('.');

  }

  const number = Number(candidate);
  return Number.isFinite(number) ? (negative ? -Math.abs(number) : number) : 0;
}

function excelSerialToDate(serial: number): Date | null {
  if (!Number.isFinite(serial)) return null;
  const utcDays = Math.floor(serial - 25569);
  return new Date(utcDays * 86400 * 1000);
}

function parseDate(value: unknown): Date | null {
  if (value instanceof Date && !Number.isNaN(value.getTime())) return value;
  if (typeof value === 'number') {
    const excel = excelSerialToDate(value);
    if (excel && !Number.isNaN(excel.getTime())) return excel;
  }
  const raw = cleanText(value);
  if (!raw) return null;
  const ddmmyyyy = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (ddmmyyyy) {
    const [, d, m, y] = ddmmyyyy;
    const date = new Date(Number(y), Number(m) - 1, Number(d));
    return Number.isNaN(date.getTime()) ? null : date;
  }
  const date = new Date(raw);
  return Number.isNaN(date.getTime()) ? null : date;
}

function dateKey(value: unknown): string {
  const date = parseDate(value);
  if (!date) return '';
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function formatDate(value: string): string {
  if (!value) return '—';
  const [y, m, d] = value.split('-').map(Number);
  if (!y || !m || !d) return value;
  return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short' }).format(new Date(y, m - 1, d));
}

function formatCurrency(value: number, compact = false): string {
  if (!Number.isFinite(value)) return 'Rp 0';
  if (compact) {
    const abs = Math.abs(value);
    if (abs >= 1_000_000_000) return `Rp ${(value / 1_000_000_000).toFixed(2).replace('.', ',')} M`; 
    if (abs >= 1_000_000) return `Rp ${(value / 1_000_000).toFixed(2).replace('.', ',')} jt`;
    if (abs >= 1_000) return `Rp ${(value / 1_000).toFixed(1).replace('.', ',')} rb`;
  }
  return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(value);
}

function formatNumber(value: number): string {
  return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(Number.isFinite(value) ? value : 0);
}

function truncate(text: string, max = 44): string {
  const value = text.trim();
  return value.length <= max ? value : `${value.slice(0, max - 1).trimEnd()}…`;
}

function clamp(value: number, min: number, max: number): number {
  return Math.min(max, Math.max(min, value));
}

function unique<T>(items: T[]): T[] {
  return Array.from(new Set(items));
}


const FIELD_ALIASES = {
  orderId: ['order id', 'order number', 'order no', 'order no.', 'id pesanan', 'nomor pesanan', 'no pesanan'],
  productName: ['product', 'product name', 'nama produk', 'produk', 'item', 'item name'],
  sku: ['sku', 'sku id', 'kode sku', 'product sku'],
  seller: ['store', 'shop', 'seller', 'toko', 'nama toko', 'shop name'],
  orderDate: ['date', 'order date', 'tanggal pesanan', 'tanggal order', 'created at', 'order time'],
  status: ['status', 'order status', 'status pesanan', 'order state'],
  units: ['units', 'quantity', 'qty', 'jumlah', 'unit terjual', 'terjual'],
  gmv: ['gmv', 'sales', 'gross merchandise value', 'nilai penjualan', 'nilai transaksi', 'total sales'],
  estimatedCommission: ['commission', 'estimated commission', 'komisi', 'estimasi komisi', 'komisi estimasi'],
  actualCommission: ['actual commission', 'paid commission', 'actual paid commission', 'realisasi komisi', 'komisi dibayar', 'komisi aktual'],
  commissionStatus: ['commission status', 'status komisi'],
  eligibilityStatus: ['eligibility status', 'status eligibility', 'kelayakan komisi', 'eligibility'],
} as const;

type FieldKey = keyof typeof FIELD_ALIASES;

type StatusHint = { status: NormalizedStatus; confidence: 'explicit' | 'filename' } | null;

const statusMatchers: Array<[NormalizedStatus, string[]]> = [
  ['not_eligible', ['tidak memenuhi syarat', 'tidak memenuhi', 'not eligible', 'ineligible', 'tidak eligible']],
  ['awaiting_buyer', ['belum dibayar pembeli', 'menunggu pembayaran pembeli', 'awaiting buyer payment', 'buyer unpaid']],
  ['paid', ['sudah dibayar', 'sudah terbayar', 'paid', 'payment completed', 'dibayar']],
  ['in_process', ['dalam proses', 'in process', 'processing', 'diproses']],
];

function normalizeStatus(rawValue: unknown): NormalizedStatus {
  const raw = cleanKey(rawValue);
  if (!raw) return 'unknown';
  for (const [status, aliases] of statusMatchers) {
    if (aliases.some((alias) => raw === cleanKey(alias) || raw.includes(cleanKey(alias)))) return status;
  }
  return 'unknown';
}

function inferStatusFromFilename(fileName: string): StatusHint {
  const raw = cleanKey(fileName.replace(/\.[^.]+$/, ''));
  for (const [status, aliases] of statusMatchers) {
    if (aliases.some((alias) => raw.includes(cleanKey(alias)))) return { status, confidence: 'filename' };
  }
  if (raw.includes('selesai') || raw === 'completed') return null;
  return null;
}

function canonicalHeader(value: unknown): string {
  return cleanKey(value);
}

function mapHeaders(headers: string[]): Partial<Record<FieldKey, number>> {
  const cleaned = headers.map(canonicalHeader);
  const mapping: Partial<Record<FieldKey, number>> = {};
  (Object.keys(FIELD_ALIASES) as FieldKey[]).forEach((field) => {
    const aliases = FIELD_ALIASES[field].map(cleanKey);
    let matchIndex = cleaned.findIndex((h) => aliases.includes(h));
    if (matchIndex < 0) {
      matchIndex = cleaned.findIndex((h) => aliases.some((alias) => h.includes(alias) || alias.includes(h)));
    }
    if (matchIndex >= 0) mapping[field] = matchIndex;
  });
  return mapping;
}

function requiredFieldWarnings(mapping: Partial<Record<FieldKey, number>>): string[] {
  const warnings: string[] = [];
  if (mapping.orderId === undefined) warnings.push('Kolom Order ID tidak ditemukan; deduplikasi lintas file akan terbatas.');
  if (mapping.productName === undefined) warnings.push('Kolom produk tidak ditemukan.');
  if (mapping.orderDate === undefined) warnings.push('Kolom tanggal pesanan tidak ditemukan.');
  if (mapping.gmv === undefined) warnings.push('Kolom GMV/penjualan tidak ditemukan.');
  if (mapping.estimatedCommission === undefined && mapping.actualCommission === undefined) {
    warnings.push('Kolom komisi tidak ditemukan.');
  }
  return warnings;
}

function cell(row: unknown[], index: number | undefined): unknown {
  return index === undefined ? undefined : row[index];
}

function normalizeRows(
  rows: unknown[][],
  headers: string[],
  fileName: string,
  sheetName: string,
  headerRowIndex: number,
): { records: NormalizedRecord[]; warnings: string[] } {
  const mapping = mapHeaders(headers);
  const warnings = requiredFieldWarnings(mapping);
  const fileHint = inferStatusFromFilename(fileName);
  const records: NormalizedRecord[] = [];

  rows.forEach((row, index) => {
    const productName = cleanText(cell(row, mapping.productName));
    const rawDate = cell(row, mapping.orderDate);
    const orderDate = dateKey(rawDate);
    const rawStatus = cleanText(cell(row, mapping.status));
    const explicitStatus = normalizeStatus(rawStatus);
    const status = explicitStatus !== 'unknown' ? explicitStatus : (fileHint?.status ?? 'unknown');
    const orderId = cleanText(cell(row, mapping.orderId));
    const sku = cleanText(cell(row, mapping.sku));
    const seller = cleanText(cell(row, mapping.seller)) || 'Unknown Store';
    const units = toNumber(cell(row, mapping.units)) || 1;
    const gmv = toNumber(cell(row, mapping.gmv));
    const estimatedCommission = toNumber(cell(row, mapping.estimatedCommission));
    const actualCommission = toNumber(cell(row, mapping.actualCommission));
    const commissionStatus = cleanText(cell(row, mapping.commissionStatus));
    const eligibilityStatus = cleanText(cell(row, mapping.eligibilityStatus));

    const hasUsefulValue = Boolean(orderId || productName || sku || gmv || estimatedCommission || actualCommission);
    if (!hasUsefulValue) return;

    if (!orderDate) return;
    if (!productName && !sku) return;

    records.push({
      orderId: orderId || `ROW-${headerRowIndex + index + 1}`,
      productName: productName || sku || 'Produk tanpa nama',
      sku,
      seller,
      orderDate,
      statusRaw: rawStatus,
      status,
      units: Math.max(0, units),
      gmv: Math.max(0, gmv),
      estimatedCommission: Math.max(0, estimatedCommission),
      actualCommission: Math.max(0, actualCommission),
      commissionStatus,
      eligibilityStatus,
      sourceFile: fileName,
      sourceSheet: sheetName,
      sourceRow: headerRowIndex + index + 1,
    });
  });

  if (fileHint?.confidence === 'filename' && mapping.status === undefined) {
    warnings.push(`Status file diambil dari nama file: ${statusLabel(fileHint.status)}.`);
  }
  if (records.length === 0) warnings.push('Tidak ada baris data yang bisa dipakai setelah normalisasi.');
  return { records, warnings };
}

function statusLabel(status: NormalizedStatus): string {
  switch (status) {
    case 'paid': return 'Sudah Dibayar';
    case 'in_process': return 'Dalam Proses';
    case 'awaiting_buyer': return 'Menunggu Pembayaran Pembeli';
    case 'not_eligible': return 'Tidak Memenuhi Syarat';
    default: return 'Status Tidak Terverifikasi';
  }
}


const supported = new Set(['xls', 'xlsx', 'csv']);

function extensionOf(fileName: string): string {
  return fileName.split('.').pop()?.toLowerCase() ?? '';
}

function findHeaderRow(matrix: unknown[][]): number {
  let bestIndex = 0;
  let bestScore = -1;
  const maxRows = Math.min(matrix.length, 25);
  for (let i = 0; i < maxRows; i++) {
    const row = matrix[i] ?? [];
    const headers = row.map((v) => String(v ?? ''));
    const mapping = mapHeaders(headers);
    const score = Object.keys(mapping).length;
    if (score > bestScore) {
      bestScore = score;
      bestIndex = i;
    }
  }
  return bestScore >= 2 ? bestIndex : 0;
}

async function parseSpreadsheet(file: File): Promise<FileResult> {
  const extension = extensionOf(file.name);
  if (!supported.has(extension)) {
    return {
      fileName: file.name,
      extension,
      size: file.size,
      valid: false,
      records: [],
      warnings: [],
      errors: [`Format .${extension || 'unknown'} tidak didukung.`],
      sheets: [],
      detectedHeaders: [],
    };
  }

  try {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array', cellDates: true, raw: true });
    const fileWarnings: string[] = [];
    const allRecords = [] as FileResult['records'];
    const sheets: string[] = [];
    let detectedHeaders: string[] = [];

    for (const sheetName of workbook.SheetNames) {
      sheets.push(sheetName);
      const sheet = workbook.Sheets[sheetName];
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null, blankrows: false }) as unknown[][];
      if (!matrix.length) {
        fileWarnings.push(`Worksheet “${sheetName}” kosong.`);
        continue;
      }
      const headerRowIndex = findHeaderRow(matrix);
      const headerRow = (matrix[headerRowIndex] ?? []).map((v) => String(v ?? '').trim());
      if (!detectedHeaders.length) detectedHeaders = headerRow.filter(Boolean);
      const dataRows = matrix.slice(headerRowIndex + 1);
      const parsed = normalizeRows(dataRows, headerRow, file.name, sheetName, headerRowIndex);
      allRecords.push(...parsed.records);
      fileWarnings.push(...parsed.warnings.map((warning) => `${sheetName}: ${warning}`));
    }

    return {
      fileName: file.name,
      extension,
      size: file.size,
      valid: allRecords.length > 0,
      records: allRecords,
      warnings: [...new Set(fileWarnings)],
      errors: [],
      sheets,
      detectedHeaders,
    };
  } catch (error) {
    return {
      fileName: file.name,
      extension,
      size: file.size,
      valid: false,
      records: [],
      warnings: [],
      errors: [`File tidak dapat dibaca. Periksa workbook atau worksheet yang dipakai.`],
      sheets: [],
      detectedHeaders: [],
    };
  }
}

async function parseFiles(files: File[]): Promise<ParserResult> {
  const results = await Promise.all(files.map(parseSpreadsheet));
  const validResults = results.filter((item) => item.valid);
  const dedupeMap = new Map<string, FileResult['records'][number]>();
  const fallback: FileResult['records'] = [];
  const duplicateWarnings: string[] = [];

  for (const result of results) {
    for (const record of result.records) {
      if (record.orderId && !record.orderId.startsWith('ROW-')) {
        const key = `${record.orderId.trim().toLowerCase()}|${record.productName.trim().toLowerCase()}`;
        if (dedupeMap.has(key)) {
          duplicateWarnings.push(`Duplikat dihapus: order ${record.orderId} (${record.sourceFile}).`);
          continue;
        }
        dedupeMap.set(key, record);
      } else {
        fallback.push(record);
      }
    }
  }

  const records = [...dedupeMap.values(), ...fallback];
  const warnings = [
    ...results.flatMap((item) => item.warnings),
    ...duplicateWarnings.slice(0, 12),
    ...(duplicateWarnings.length > 12 ? [`${duplicateWarnings.length - 12} duplikat lain tidak ditampilkan.`] : []),
  ];
  const errors = results.flatMap((item) => item.errors.map((error) => `${item.fileName}: ${error}`));
  return { files: results, records, warnings: [...new Set(warnings)], errors: [...new Set(errors)] };
}


const KNOWN_STATUSES: NormalizedStatus[] = ['paid', 'in_process', 'awaiting_buyer', 'not_eligible'];

function rowCommission(record: NormalizedRecord): number {
  return record.actualCommission > 0 ? record.actualCommission : record.estimatedCommission;
}

function estimatedCommission(record: NormalizedRecord): number {
  return record.estimatedCommission > 0 ? record.estimatedCommission : record.actualCommission;
}

function uniqueOrderCount(records: NormalizedRecord[]): number {
  return new Set(records.map((record) => record.orderId).filter(Boolean)).size;
}

function uniqueProductCount(records: NormalizedRecord[]): number {
  return new Set(records.map((record) => `${record.sku || ''}|${record.productName.trim().toLowerCase()}`)).size;
}

function topValue<T extends { units: number; gmv: number; commission: number }>(items: T[], key: 'units' | 'gmv' | 'commission') {
  return items.slice().sort((a, b) => b[key] - a[key])[0];
}

function rankProducts(records: NormalizedRecord[]): ReportModel['topProducts'] {
  const map = new Map<string, { name: string; units: number; orders: Set<string>; gmv: number; commission: number }>();
  records.forEach((record) => {
    const key = `${record.sku || ''}|${record.productName.trim().toLowerCase()}`;
    const existing = map.get(key) ?? { name: record.productName, units: 0, orders: new Set<string>(), gmv: 0, commission: 0 };
    existing.units += record.units;
    existing.orders.add(record.orderId);
    existing.gmv += record.gmv;
    existing.commission += estimatedCommission(record);
    map.set(key, existing);
  });
  return [...map.values()]
    .map((item) => ({ name: item.name, units: item.units, orders: item.orders.size, gmv: item.gmv, commission: item.commission }))
    .sort((a, b) => b.units - a.units || b.commission - a.commission)
    .slice(0, 5);
}

function rankSellers(records: NormalizedRecord[]): ReportModel['topSellers'] {
  const map = new Map<string, { units: number; orders: Set<string>; gmv: number; commission: number }>();
  records.forEach((record) => {
    const key = record.seller || 'Unknown Store';
    const existing = map.get(key) ?? { units: 0, orders: new Set<string>(), gmv: 0, commission: 0 };
    existing.units += record.units;
    existing.orders.add(record.orderId);
    existing.gmv += record.gmv;
    existing.commission += estimatedCommission(record);
    map.set(key, existing);
  });
  return [...map.entries()]
    .map(([seller, item]) => ({ seller, units: item.units, orders: item.orders.size, gmv: item.gmv, commission: item.commission }))
    .sort((a, b) => b.commission - a.commission || b.gmv - a.gmv)
    .slice(0, 5);
}

function buildStatusSummary(records: NormalizedRecord[], status: NormalizedStatus): StatusSummary {
  const rows = records.filter((record) => record.status === status);
  const products = rankProducts(rows);
  const sellers = rankSellers(rows);
  const uniqueProductKeys = new Set(rows.map((row) => `${row.sku || ''}|${row.productName.toLowerCase()}`));
  const uniqueSellerKeys = new Set(rows.map((row) => row.seller.trim().toLowerCase()).filter(Boolean));
  return {
    status,
    label: statusLabel(status),
    orders: uniqueOrderCount(rows),
    units: rows.reduce((sum, row) => sum + row.units, 0),
    gmv: rows.reduce((sum, row) => sum + row.gmv, 0),
    commission: rows.reduce((sum, row) => sum + rowCommission(row), 0),
    uniqueProducts: uniqueProductKeys.size,
    uniqueSellers: uniqueSellerKeys.size,
    skuRows: rows.length,
    topSeller: sellers[0]?.seller ?? '—',
    topProduct: products[0]?.name ?? '—',
  };
}

function buildStatusFileSummaries(records: NormalizedRecord[]): StatusFileSummary[] {
  const map = new Map<string, NormalizedRecord[]>();
  records.forEach((record) => {
    const key = `${record.sourceFile}||${record.status}`;
    const rows = map.get(key) ?? [];
    rows.push(record);
    map.set(key, rows);
  });
  return [...map.entries()]
    .map(([key, rows]) => {
      const [sourceFile, rawStatus] = key.split('||');
      const status = rawStatus as NormalizedStatus;
      const summary = buildStatusSummary(rows, status);
      return { ...summary, sourceFile };
    })
    .sort((a, b) => a.sourceFile.localeCompare(b.sourceFile) || a.label.localeCompare(b.label));
}

function buildDaily(records: NormalizedRecord[]) {
  const map = new Map<string, { orders: Set<string>; units: number; gmv: number; commission: number }>();
  records.forEach((record) => {
    const existing = map.get(record.orderDate) ?? { orders: new Set<string>(), units: 0, gmv: 0, commission: 0 };
    existing.orders.add(record.orderId);
    existing.units += record.units;
    existing.gmv += record.gmv;
    existing.commission += estimatedCommission(record);
    map.set(record.orderDate, existing);
  });
  return [...map.entries()]
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([date, item]) => ({
      date,
      label: formatDate(date),
      orders: item.orders.size,
      units: item.units,
      gmv: item.gmv,
      commission: item.commission,
    }));
}

function peak(daily: ReportModel['daily'], key: 'orders' | 'units' | 'gmv' | 'commission', label: string) {
  if (!daily.length) return null;
  const row = daily.slice().sort((a, b) => b[key] - a[key])[0];
  return { label, value: row[key], date: row.date };
}

function aggregateReport(records: NormalizedRecord[], fileCount: number): ReportModel {
  const known = records.filter((record) => KNOWN_STATUSES.includes(record.status));
  const daily = buildDaily(known.length ? known : records);
  const dates = records.map((record) => record.orderDate).filter(Boolean).sort();
  const estimatedCommission = records.reduce((sum, row) => sum + row.estimatedCommission, 0);
  const paidCommission = records.filter((row) => row.status === 'paid').reduce((sum, row) => sum + rowCommission(row), 0);
  const inProcessCommission = records.filter((row) => row.status === 'in_process').reduce((sum, row) => sum + rowCommission(row), 0);
  const awaitingBuyerCommission = records.filter((row) => row.status === 'awaiting_buyer').reduce((sum, row) => sum + rowCommission(row), 0);
  const notEligibleCommission = records.filter((row) => row.status === 'not_eligible').reduce((sum, row) => sum + rowCommission(row), 0);
  const statusSummaries = KNOWN_STATUSES.map((status) => buildStatusSummary(records, status));
  const topRiskProducts = rankProducts(records.filter((row) => row.status === 'not_eligible')).slice(0, 3);
  const totalRiskBase = estimatedCommission || paidCommission + inProcessCommission + awaitingBuyerCommission + notEligibleCommission;
  const riskPercentage = totalRiskBase > 0 ? (notEligibleCommission / totalRiskBase) * 100 : 0;
  const distributions = KNOWN_STATUSES.map((status) => {
    const summary = statusSummaries.find((item) => item.status === status)!;
    const denominator = statusSummaries.reduce((sum, item) => sum + item.commission, 0);
    return {
      status,
      label: summary.label,
      amount: summary.commission,
      percentage: denominator > 0 ? (summary.commission / denominator) * 100 : 0,
    };
  });

  const peakOrders = peak(daily, 'orders', 'Puncak order');
  const peakUnits = peak(daily, 'units', 'Puncak unit');
  const peakGMV = peak(daily, 'gmv', 'Puncak GMV');
  const peakCommission = peak(daily, 'commission', 'Puncak komisi estimasi');

  const insightParts = [
    peakOrders ? `${formatDate(peakOrders.date)} = puncak order (${formatNumber(peakOrders.value)})` : null,
    peakUnits ? `${formatDate(peakUnits.date)} = puncak unit (${formatNumber(peakUnits.value)})` : null,
    peakCommission ? `puncak komisi ${formatCurrency(peakCommission.value)}` : null,
  ].filter(Boolean);

  return {
    generatedAt: new Date().toISOString(),
    fileCount,
    dateStart: dates[0] ?? '',
    dateEnd: dates[dates.length - 1] ?? '',
    totalUnits: records.reduce((sum, row) => sum + row.units, 0),
    uniqueOrders: uniqueOrderCount(records),
    uniqueProducts: uniqueProductCount(records),
    totalGMV: records.reduce((sum, row) => sum + row.gmv, 0),
    estimatedCommission,
    paidCommission,
    inProcessCommission,
    awaitingBuyerCommission,
    notEligibleCommission,
    statusSummaries,
    statusFileSummaries: buildStatusFileSummaries(records),
    daily,
    topProducts: rankProducts(records),
    topSellers: rankSellers(records),
    peaks: {
      orders: peakOrders,
      units: peakUnits,
      gmv: peakGMV,
      commission: peakCommission,
    },
    commissionDistribution: distributions,
    risk: { amount: notEligibleCommission, percentage: riskPercentage, topProducts: topRiskProducts },
    insight: insightParts.length ? `Insight: ${insightParts.join(' • ')}.` : 'Insight: belum cukup data terverifikasi untuk merangkum pola.',
  };
}


function usePrefersReducedMotion(): boolean {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    const media = window.matchMedia('(prefers-reduced-motion: reduce)');
    const update = () => setReduced(media.matches);
    update();
    media.addEventListener('change', update);
    return () => media.removeEventListener('change', update);
  }, []);
  return reduced;
}

function useElapsed(active: boolean): number {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    if (!active) {
      setElapsed(0);
      return;
    }
    const start = performance.now();
    let frame = 0;
    const loop = (now: number) => {
      setElapsed((now - start) / 1000);
      frame = requestAnimationFrame(loop);
    };
    frame = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(frame);
  }, [active]);
  return elapsed;
}


function PatternWaves() {
  const canvasRef = useRef<HTMLCanvasElement | null>(null);
  const reducedMotion = usePrefersReducedMotion();

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const context = canvas.getContext('2d', { alpha: true });
    if (!context) return;

    let animationFrame = 0;
    let width = 0;
    let height = 0;
    let dpr = 1;
    let start = performance.now();
    const pointer = { x: 0.5, y: 0.45, active: false };

    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(1, rect.width);
      height = Math.max(1, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const observer = new ResizeObserver(resize);
    observer.observe(canvas);
    resize();

    const onPointer = (event: PointerEvent) => {
      pointer.x = event.clientX / Math.max(1, window.innerWidth);
      pointer.y = event.clientY / Math.max(1, window.innerHeight);
      pointer.active = true;
    };
    window.addEventListener('pointermove', onPointer, { passive: true });

    const draw = (now: number) => {
      const t = reducedMotion ? 0 : (now - start) / 1000;
      context.clearRect(0, 0, width, height);
      context.fillStyle = '#030305';
      context.fillRect(0, 0, width, height);

      const spacing = Math.max(18, Math.min(29, width / 52));
      const cols = Math.ceil(width / spacing) + 2;
      const rows = Math.ceil(height / spacing) + 2;
      const angle = -0.34;
      const sweep = ((t * 0.075) % 1.4) - 0.2;
      const px = pointer.active ? pointer.x * width : width * 0.5;
      const py = pointer.active ? pointer.y * height : height * 0.45;

      context.save();
      context.translate(width * 0.5, height * 0.5);
      context.rotate(angle);
      context.translate(-width * 0.5, -height * 0.5);

      for (let row = -1; row < rows; row++) {
        for (let col = -1; col < cols; col++) {
          const x = col * spacing;
          const y = row * spacing;
          const wavePosition = (x / width) * 0.8 + (y / height) * 0.35;
          const distance = Math.abs((((wavePosition - sweep + 1) % 1) - 0.5) * 2);
          const wave = Math.max(0, 1 - distance * 7);
          const pointerDist = Math.hypot(x - px, y - py);
          const pointerGlow = pointer.active ? Math.max(0, 1 - pointerDist / 230) * 0.5 : 0;
          const alpha = 0.11 + wave * 0.25 + pointerGlow * 0.12;
          const radius = 0.85 + wave * 1.35 + pointerGlow * 0.5;
          context.beginPath();
          context.fillStyle = `rgba(109, 40, 217, ${alpha})`;
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fill();
        }
      }
      context.restore();

      context.save();
      const grad = context.createLinearGradient(0, height, width, 0);
      grad.addColorStop(0, 'rgba(3,3,5,0)');
      grad.addColorStop(0.45, 'rgba(139,92,246,0)');
      grad.addColorStop(0.52, 'rgba(167,139,250,0.07)');
      grad.addColorStop(0.57, 'rgba(76,29,149,0.04)');
      grad.addColorStop(1, 'rgba(3,3,5,0)');
      context.fillStyle = grad;
      context.fillRect(0, 0, width, height);
      context.restore();

      animationFrame = requestAnimationFrame(draw);
    };

    animationFrame = requestAnimationFrame(draw);
    return () => {
      cancelAnimationFrame(animationFrame);
      observer.disconnect();
      window.removeEventListener('pointermove', onPointer);
    };
  }, [reducedMotion]);

  return <canvas ref={canvasRef} className="pattern-waves" aria-hidden="true" />;
}

function ParticleText({ text = 'VELLORA' }: { text?: string }) {
  const ref = useRef<HTMLCanvasElement | null>(null);
  const reducedMotion = usePrefersReducedMotion();

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    let width = 900;
    let height = 240;
    let dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    let frame = 0;
    let start = performance.now();
    let particles: Array<{ x: number; y: number; tx: number; ty: number; phase: number }> = [];

    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(320, rect.width);
      height = Math.max(120, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const off = document.createElement('canvas');
      off.width = Math.floor(width * dpr);
      off.height = Math.floor(height * dpr);
      const octx = off.getContext('2d');
      if (!octx) return;
      octx.scale(dpr, dpr);
      const fontSize = Math.min(190, width * 0.24);
      octx.font = `800 ${fontSize}px Inter, ui-sans-serif, system-ui, sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillStyle = '#fff';
      octx.fillText(text, width / 2, height / 2 + 3);
      const image = octx.getImageData(0, 0, off.width, off.height);
      const stride = Math.max(5, Math.floor(8 / dpr));
      const targets: Array<[number, number]> = [];
      for (let y = 0; y < off.height; y += stride) {
        for (let x = 0; x < off.width; x += stride) {
          const alpha = image.data[(y * off.width + x) * 4 + 3];
          if (alpha > 80) targets.push([x / dpr, y / dpr]);
        }
      }
      const targetCount = Math.min(reducedMotion ? 900 : 1400, targets.length);
      particles = [];
      for (let i = 0; i < targetCount; i++) {
        const [tx, ty] = targets[Math.floor((i / targetCount) * targets.length)];
        particles.push({
          tx,
          ty,
          x: width / 2 + (Math.random() - 0.5) * width * 1.4,
          y: height / 2 + (Math.random() - 0.5) * height * 1.8,
          phase: Math.random() * Math.PI * 2,
        });
      }
    };

    const observer = new ResizeObserver(resize);
    observer.observe(canvas);
    resize();

    const draw = (now: number) => {
      const t = reducedMotion ? 4 : (now - start) / 1000;
      ctx.clearRect(0, 0, width, height);
      const progress = reducedMotion ? 1 : Math.min(1, Math.max(0, (t - 0.2) / 3.8));
      const ease = 1 - Math.pow(1 - progress, 3);

      particles.forEach((particle, index) => {
        particle.x += (particle.tx - particle.x) * (0.025 + ease * 0.075);
        particle.y += (particle.ty - particle.y) * (0.025 + ease * 0.075);
        const idle = progress >= 1 && !reducedMotion ? Math.sin(t * 0.8 + particle.phase) * 0.55 : 0;
        const violet = index % 11 === 0;
        ctx.beginPath();
        ctx.fillStyle = violet ? 'rgba(167, 139, 250, 0.9)' : 'rgba(245,245,247,0.92)';
        ctx.shadowColor = violet ? 'rgba(139,92,246,0.22)' : 'rgba(255,255,255,0.1)';
        ctx.shadowBlur = violet ? 7 : 2;
        ctx.arc(particle.x, particle.y + idle, violet ? 1.45 : 1.15, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
      frame = requestAnimationFrame(draw);
    };
    frame = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(frame);
      observer.disconnect();
    };
  }, [text, reducedMotion]);

  return (
    <div className="particle-text-wrap">
      <canvas ref={ref} className="particle-text" aria-hidden="true" />
      <span className="sr-only">{text}</span>
    </div>
  );
}

interface GlideOption<T extends string> { value: T; label: string; description?: string }

function GlideSelect<T extends string>({
  value,
  options,
  onChange,
  label,
}: {
  value: T;
  options: GlideOption<T>[];
  onChange: (value: T) => void;
  label: string;
}) {
  const [open, setOpen] = useState(false);
  const [highlight, setHighlight] = useState(Math.max(0, options.findIndex((option) => option.value === value)));
  const root = useRef<HTMLDivElement | null>(null);
  const selected = options.find((option) => option.value === value) ?? options[0];

  useEffect(() => {
    const onOutside = (event: PointerEvent) => {
      if (!root.current?.contains(event.target as Node)) setOpen(false);
    };
    document.addEventListener('pointerdown', onOutside);
    return () => document.removeEventListener('pointerdown', onOutside);
  }, []);

  const selectedIndex = useMemo(() => options.findIndex((option) => option.value === value), [options, value]);

  const onKeyDown = (event: KeyboardEvent<HTMLButtonElement>) => {
    if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
      event.preventDefault();
      const next = Math.min(options.length - 1, (highlight < 0 ? selectedIndex : highlight) + 1);
      setHighlight(next);
      if (open) onChange(options[next].value);
    } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
      event.preventDefault();
      const next = Math.max(0, (highlight < 0 ? selectedIndex : highlight) - 1);
      setHighlight(next);
      if (open) onChange(options[next].value);
    } else if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      setOpen((openState) => !openState);
    } else if (event.key === 'Escape') {
      setOpen(false);
    }
  };

  return (
    <div className="glide-select" ref={root}>
      <span className="field-label">{label}</span>
      <button
        type="button"
        className="glide-trigger"
        aria-haspopup="listbox"
        aria-expanded={open}
        onClick={() => setOpen((state) => !state)}
        onKeyDown={onKeyDown}
      >
        <span>
          <strong>{selected?.label}</strong>
          {selected?.description && <small>{selected.description}</small>}
        </span>
        <span className={`chevron ${open ? 'open' : ''}`} aria-hidden="true">⌄</span>
      </button>
      <div className={`glide-menu ${open ? 'open' : ''}`} role="listbox" aria-label={label}>
        {options.map((option, index) => (
          <button
            type="button"
            role="option"
            aria-selected={value === option.value}
            key={option.value}
            className={`glide-option ${value === option.value ? 'selected' : ''}`}
            onMouseEnter={() => setHighlight(index)}
            onClick={() => {
              onChange(option.value);
              setOpen(false);
            }}
          >
            <span className="glide-indicator" style={{ transform: `translateY(${highlight * 100}%)` }} aria-hidden="true" />
            <span><strong>{option.label}</strong>{option.description && <small>{option.description}</small>}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

interface QueuedFile {
  file: File;
  id: string;
  state: 'ready' | 'parsing' | 'invalid';
  message?: string;
}

function fileId(file: File) { return `${file.name}-${file.size}-${file.lastModified}`; }

function UploadDropzone({ files, setFiles }: { files: QueuedFile[]; setFiles: Dispatch<SetStateAction<QueuedFile[]>> }) {
  const inputRef = useRef<HTMLInputElement | null>(null);
  const [over, setOver] = useState(false);

  const addFiles = (incoming: File[]) => {
    const accepted = incoming.filter((file) => ['xls', 'xlsx', 'csv'].includes(file.name.split('.').pop()?.toLowerCase() ?? ''));
    setFiles((current) => {
      const known = new Set(current.map((item) => item.id));
      const next = accepted.filter((file) => !known.has(fileId(file))).map((file) => ({ file, id: fileId(file), state: 'ready' as const }));
      return [...current, ...next];
    });
  };

  useEffect(() => {
    const onPaste = (event: ClipboardEvent) => {
      const files = Array.from(event.clipboardData?.files ?? []);
      if (files.length) addFiles(files);
    };
    window.addEventListener('paste', onPaste);
    return () => window.removeEventListener('paste', onPaste);
  });

  return (
    <div className="upload-stack">
      <div
        className={`dropzone ${over ? 'is-over' : ''}`}
        onDragOver={(event: any) => { event.preventDefault(); setOver(true); }}
        onDragLeave={() => setOver(false)}
        onDrop={(event: any) => { event.preventDefault(); setOver(false); addFiles(Array.from(event.dataTransfer.files)); }}
        onClick={() => inputRef.current?.click()}
      >
        <input ref={inputRef} type="file" hidden accept=".xls,.xlsx,.csv" multiple onChange={(event: any) => addFiles(Array.from(event.target.files ?? []))} />
        <div className="drop-icon"><Upload size={20} /></div>
        <div>
          <strong>UPLOAD DATA AFFILIATE</strong>
          <p>Tarik file ke sini atau pilih dari perangkat</p>
          <small>.xls · .xlsx · .csv · multi-file</small>
        </div>
      </div>

      <div className="file-list" aria-live="polite">
        <div className="file-list-head"><span>FILES READY</span><strong>{files.length}</strong></div>
        {files.length === 0 ? (
          <div className="empty-file">No affiliate data yet.<span>Upload your XLS atau XLSX report untuk mulai.</span></div>
        ) : (
          files.map((item) => (
            <div className="file-row" key={item.id}>
              <div className="file-symbol"><FileSpreadsheet size={16} /></div>
              <div className="file-meta"><strong>{item.file.name}</strong><span>{item.file.name.split('.').pop()?.toUpperCase()} · {formatNumber(item.file.size / 1024)} KB</span></div>
              <div className="file-state">{item.state === 'ready' ? '✓ Ready' : item.state === 'invalid' ? '× Invalid' : '… Parsing'}</div>
              <button type="button" className="icon-button subtle" onClick={(event: any) => { event.stopPropagation(); setFiles((current) => current.filter((file) => file.id !== item.id)); }} aria-label={`Hapus ${item.file.name}`}><X size={14} /></button>
            </div>
          ))
        )}
      </div>
    </div>
  );
}
